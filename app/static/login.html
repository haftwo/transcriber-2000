<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Audio Transcriber - 2000</title>
<script>try{var t=localStorage.getItem("theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/static/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#1e6184">
</head>
<body>
<main class="auth-page">
  <form class="auth-card" id="form" novalidate>
    <div class="brand"><img class="brand-mark" src="/static/favicon.svg" alt="">Audio Transcriber - 2000</div>
    <h1 id="title">Welcome back</h1>
    <p class="lede" id="lede">Sign in to see your live transcripts.</p>
    <div class="error-msg" id="err" hidden></div>
    <label class="field"><span>Username</span><input type="text" name="username" autocomplete="username" autofocus required></label>
    <label class="field"><span>Password</span><input type="password" name="password" autocomplete="current-password" required></label>
    <label class="field" id="confirm-wrap" hidden><span>Confirm password</span><input type="password" name="confirm" autocomplete="new-password"></label>
    <button class="btn primary" id="submit">Sign in</button>
    <div id="sso" hidden>
      <div class="auth-or"><span>or</span></div>
      <a class="btn sso-btn" id="sso-btn" href="/auth/microsoft">
        <svg viewBox="0 0 21 21" width="16" height="16" aria-hidden="true"><rect x="1" y="1" width="9" height="9" fill="#f25022"/><rect x="11" y="1" width="9" height="9" fill="#7fba00"/><rect x="1" y="11" width="9" height="9" fill="#00a4ef"/><rect x="11" y="11" width="9" height="9" fill="#ffb900"/></svg>
        <span id="sso-label">Sign in with Microsoft</span></a>
    </div>
  </form>
  <div class="auth-theme" id="auth-theme"></div>
</main>
<script src="/static/common.js"></script>
<script>
mountThemePicker(document.getElementById("auth-theme"));
let setupMode = false;
const f = document.getElementById("form"), err = document.getElementById("err");

const urlError = new URLSearchParams(location.search).get("error");
if (urlError) { err.textContent = urlError; err.hidden = false; history.replaceState(null, "", "/login"); }

api("GET", "/api/setup").then(r => {
  if (r.sso && !r.needs_setup) {
    document.getElementById("sso-label").textContent = r.sso_label;
    document.getElementById("sso").hidden = false;
  }
  if (!r.needs_setup) return;
  setupMode = true;
  document.getElementById("title").textContent = "Create your admin account";
  document.getElementById("lede").textContent = "First time here. This account can manage streams, users and settings.";
  document.getElementById("confirm-wrap").hidden = false;
  f.password.autocomplete = "new-password";
  document.getElementById("submit").textContent = "Create account";
});

f.addEventListener("submit", async e => {
  e.preventDefault();
  err.hidden = true;
  const username = f.username.value.trim(), password = f.password.value;
  if (!username || !password) { err.textContent = "Enter a username and password"; err.hidden = false; return; }
  if (setupMode && password !== f.confirm.value) { err.textContent = "Passwords don't match"; err.hidden = false; return; }
  const btn = document.getElementById("submit");
  btn.disabled = true;
  try {
    await api("POST", setupMode ? "/api/setup" : "/api/login", { username, password });
    location.href = "/";
  } catch (ex) {
    err.textContent = ex.message; err.hidden = false; btn.disabled = false;
    f.password.select();
  }
});
</script>
</body>
</html>
