services:
  transcriber-2000:
    # Docker Hub image. Also published as ghcr.io/haftwo/transcriber-2000:latest by GitHub Actions.
    # (Or comment out "image" and uncomment "build" to build locally instead.)
    image: haftwo/transcriber-2000:latest
    # build: .
    container_name: transcriber-2000
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Your whisper-asr-webservice container (LAN IP of the Unraid box, not localhost).
      # Only used on first start; afterwards change it in Admin > Settings.
      - WHISPER_URL=http://192.168.1.10:9000
      - TZ=Australia/Melbourne
      # Set to 1 when the site is only reached over HTTPS (e.g. via Cloudflare Tunnel).
      - COOKIE_SECURE=0
    volumes:
      # Keep this line: it is what makes settings, users and recordings survive updates.
      - /mnt/user/appdata/transcriber-2000:/data
